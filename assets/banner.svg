<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="210" viewBox="0 0 800 210" role="img" aria-label="Princess Jade B. Antoque, 2nd-Year BSIT Student and Aspiring Software Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#1B1533"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <style>
      .name { font: 700 40px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #F0F6FC; letter-spacing: 0.5px; }
      .role { font: 500 18px 'Fira Code', Consolas, 'Courier New', monospace; fill: #C4B5FD; }
      .note { font: 400 14px 'Fira Code', Consolas, 'Courier New', monospace; fill: #8B949E; }
      .cursor { fill: #A78BFA; animation: blink 1.2s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    </style>
  </defs>

  <rect width="800" height="210" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="799" height="209" rx="14" fill="none" stroke="#A78BFA" stroke-opacity="0.4"/>

  <text x="400" y="52" text-anchor="middle" class="note">&lt;/&gt; portfolio.md</text>
  <text x="400" y="112" text-anchor="middle" class="name">Princess Jade B. Antoque</text>
  <text x="400" y="146" text-anchor="middle" class="role">2nd-Year BSIT Student • Aspiring Software Engineer</text>

  <rect x="250" y="163" width="300" height="2" fill="url(#rule)"/>

  <text x="400" y="190" text-anchor="middle" class="note">// still learning, one project at a time<tspan class="cursor"> ▌</tspan></text>
</svg>
